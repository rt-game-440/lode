name: Release

# 推送 v* tag 时：构建全平台二进制和 SHA256SUMS 上传到 GitHub Release，
# 构建多架构镜像推送到 ghcr.io/<owner>/lode（<版本> 和 latest 两个标签）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: 二进制与 GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 构建全部平台
        run: scripts/release.sh "${GITHUB_REF_NAME}"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 说明取 CHANGELOG.md 里这个版本的一节
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?v?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > /tmp/notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Lode ${GITHUB_REF_NAME}" --notes-file /tmp/notes.md --verify-tag

  image:
    name: 多架构镜像
    # 二进制发布成功后再推镜像，避免一边失败时留下半套发布
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lode
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # 预发布版本（v0.2.0-rc.1 这类带 - 的 tag）不更新 latest
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
